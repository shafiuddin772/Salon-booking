spring.application.name=api-gateway

server.port=5000

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8070/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# USER SERVICE
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**


# SALON SERVICE
spring.cloud.gateway.server.webflux.routes[1].id=salon-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://SALON-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/salons/**


# SERVICE OFFERING
spring.cloud.gateway.server.webflux.routes[2].id=service-offering-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://SERVICE-OFFERING-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/service/**


# BOOKING SERVICE
spring.cloud.gateway.server.webflux.routes[3].id=booking-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/bookings/**


spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://127.0.0.1:5500
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
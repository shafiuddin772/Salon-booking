
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Find Salon</title>

    <link rel="stylesheet"
          href="./css/login.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        <span class="logo-span">Find</span> Salon
    </div>

</header>


<section>

    <div class="login-form-container">

        <div class="login-form">

            <p class="login-subtitle">
                Sign Up
            </p>


            <form id="signupForm">

                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your Email"
                        required
                    >

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your Phone Number"
                        required
                    >

                </div>


                <!-- Name -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your Name"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Register Button -->

                <button
                    type="submit"
                    class="login-btn">

                    Register

                </button>

            </form>


            <!-- Divider -->

            <div class="divider">

                <span>
                    OR
                </span>

            </div>


            <!-- Google -->

            <button
                class="google-btn"
                type="button">

                Continue with Google

            </button>


            <!-- Login -->

            <p class="signup-text">

                Having an account?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </div>

    </div>

</section>


<footer>

    <p>
        © 2026 SalonBook. All rights reserved.
    </p>

</footer>


<script src="./js/signup.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <!-- header  part -->
    <header class="navbar">
<div class="logo">
   <span class="logo-span">Find</span> Salon 
</div>
    </header>

    <!-- login form -->

    <section>
<div class="login-form-container">
 <div class="login-form">
   

    <p class="login-subtitle">
        Sign in
    </p>

    <form id="loginForm">
        <!-- Email -->
         <div class="form-group">
            <label for="email">
                Email Address
            </label>
            <input type="email"
            id="email"
            name="email"
            placeholder="Enter your Email"
            required>
         </div>

         <!-- Password -->
          <div class="form-group">
<label for="password">Password</label>
<input type="password"
id="password"
name="password"
placeholder="Enter your password"
required>
          </div>


          <!-- Login Button --> <button type="submit" class="login-btn"> Login </button>
    </form>

    <!-- Divider -->
     <div class="divider">
<span>
    OR
</span>
     </div>

     <!-- Google --> <button class="google-btn" type="button"> Continue with Google </button>
 
 <!-- Signup --> <p class="signup-text"> Don't have an account? <a href="signup.html"> Create Account </a> </p>
 
    </div>
     </div>
    </section>
     

     <footer> <p> © 2026 SalonBook. All rights reserved. </p> </footer>
     <script src="./js/login.js"></script>
</body>
</html>
